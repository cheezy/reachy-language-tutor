[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_language_tutor"
version = "1.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [ "huggingface-hub>=1.17.0", "httpx>=0.28.1", "python-dotenv", "openai==2.28.0", "reachy_mini_dances_library", "reachy-mini>=1.10.0rc5", "mcp>=1.27.1,<2",]
[[project.authors]]
name = "Pollen Robotics"
email = "contact@pollen-robotics.com"

[dependency-groups]
dev = [ "allure-pytest==2.16.0", "pytest", "pytest-asyncio", "pytest-cov==7.1.0", "ruff==0.15.20", "mypy==2.2.0", "pre-commit",]

[project.scripts]
reachy-language-tutor = "reachy_language_tutor.main:main"

[tool.uv]
exclude-newer = "7 days"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 119
exclude = [ ".venv", "dist", "build", "**/__pycache__", "*.egg-info", ".mypy_cache", ".pytest_cache",]

[tool.pytest.ini_options]
testpaths = [ "tests",]
# These seven files come from the upstream conversation app and test profile
# SWITCHING. This app sets config.LOCKED_PROFILE, which deliberately disables
# switching, so 31 of their tests fail by design rather than by regression.
# They are excluded so the suite is a trustworthy pass/fail signal.
# Revisit if the app ever stops locking its profile.
addopts = "--ignore-glob=*/test_personality_routes.py --ignore-glob=*/test_tool_space_routes.py --ignore-glob=*/test_console.py --ignore-glob=*/test_personality_delete.py --ignore-glob=*/test_startup_settings.py --ignore-glob=*/test_config_name_collisions.py --ignore-glob=*/test_profile_paths.py"

[tool.mypy]
python_version = "3.12"
files = [ "src/",]
ignore_missing_imports = true
strict = true
show_error_codes = true
warn_unused_ignores = true

[project.entry-points.reachy_mini_apps]
reachy_language_tutor = "reachy_language_tutor.main:ReachyLanguageTutor"

[tool.uv.exclude-newer-package]
reachy-mini = false
reachy-mini-dances-library = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
reachy_talk_data = [ "profiles/**/*.md",]
reachy_language_tutor = [ "static/**/*", ".env.example", "learners/*.sql",]

[tool.ruff.lint]
select = [ "E", "F", "W", "I", "C4", "D",]
ignore = [ "E501", "D100", "D203", "D213",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools.packages.find]
where = [ "src",]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
no-lines-before = [ "standard-library", "local-folder",]
known-local-folder = [ "reachy_language_tutor",]
known-first-party = [ "reachy_mini", "reachy_mini_dances_library",]
split-on-trailing-comma = true
