[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_language_tutor"
version = "1.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.11"
# opencv-python-headless, not opencv-python, and the distinction is load-bearing:
# they both provide `cv2`, so installing both lets two distributions fight over the
# same import. reachy-mini pulls opencv-python under BOTH its [opencv] and [examples]
# extras, and [all] pulls [opencv] transitively -- so reachy-mini[all], the most
# likely way to meet this, collides too. Headless
# is the right half for a robot: no GUI bindings, a smaller wheel, and nothing here
# ever opens a window. The floor is 4.10 because FaceDetectorYN and FaceRecognizerSF
# arrived in 4.5.4 and this is comfortably past it.
dependencies = [ "huggingface-hub>=1.17.0", "httpx>=0.28.1", "python-dotenv", "openai==2.28.0", "reachy_mini_dances_library", "reachy-mini>=1.10.0rc5", "mcp>=1.27.1,<2", "opencv-python-headless>=4.10,<6",]
[[project.authors]]
name = "Pollen Robotics"
email = "contact@pollen-robotics.com"

[dependency-groups]
dev = [ "allure-pytest==2.16.0", "pytest", "pytest-asyncio", "pytest-cov==7.1.0", "ruff==0.15.20", "mypy==2.2.0", "pre-commit",]

[project.scripts]
reachy-language-tutor = "reachy_language_tutor.main:main"

[tool.uv]
exclude-newer = "7 days"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 119
exclude = [ ".venv", "dist", "build", "**/__pycache__", "*.egg-info", ".mypy_cache", ".pytest_cache",]

[tool.pytest.ini_options]
testpaths = [ "tests",]
# There is deliberately no addopts here, and in particular no file-level ignore pattern.
#
# Seven files from the upstream conversation app test profile SWITCHING, which this
# app disables by setting config.LOCKED_PROFILE, so some of their tests fail by design
# rather than by regression. They used to be excluded a whole FILE at a time. That
# silenced 31 by-design failures at the cost of 69 passing tests in the same files --
# and, worse, silently swallowed any test ADDED to one of those files afterwards. It
# happened: tests for a .env line-injection fix were written in test_console.py, passed
# when run directly, and were never collected by `pytest reachy_language_tutor -q`, the
# command the after_doing hook and every verification step use. The suite total simply
# did not move. A security test that never runs is a green tick that means nothing.
#
# So the refusal now lives on the tests that actually fail, conditioned on the real
# cause: tests/profile_lock.py exports a skipif bound to config.LOCKED_PROFILE, and the
# affected tests carry it. If the app ever stops locking its profile, every one of them
# starts running again on its own -- nobody has to remember this comment exists.
# See D21, and tests/profile_lock.py for the four mechanisms behind those failures.
#
# tests/test_pytest_configuration.py enforces the no-file-level-exclusion rule, so this
# cannot quietly come back.

[tool.mypy]
python_version = "3.12"
files = [ "src/",]
ignore_missing_imports = true
strict = true
show_error_codes = true
warn_unused_ignores = true

[project.entry-points.reachy_mini_apps]
reachy_language_tutor = "reachy_language_tutor.main:ReachyLanguageTutor"

[tool.uv.exclude-newer-package]
reachy-mini = false
reachy-mini-dances-library = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
reachy_talk_data = [ "profiles/**/*.md",]
reachy_language_tutor = [ "static/**/*", ".env.example", "learners/*.sql", "learners/*.json",]

[tool.ruff.lint]
select = [ "E", "F", "W", "I", "C4", "D",]
ignore = [ "E501", "D100", "D203", "D213",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools.packages.find]
where = [ "src",]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
no-lines-before = [ "standard-library", "local-folder",]
known-local-folder = [ "reachy_language_tutor",]
known-first-party = [ "reachy_mini", "reachy_mini_dances_library",]
split-on-trailing-comma = true
